version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trackingmap-db
    environment:
      POSTGRES_DB: trackingmap
      POSTGRES_USER: trackingmap
      POSTGRES_PASSWORD: trackingmap123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
    - trackingmap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackingmap"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trackingmap-backend
    ports:
      - "8000:8000"
    environment:
      USE_AZURE_SQL: "false"
      USE_POSTGRES: true
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: trackingmap
      POSTGRES_USER: trackingmap
      POSTGRES_PASSWORD: trackingmap123
      TTN_APP_ID: ${TTN_APP_ID:-dummy-app-id}
      TTN_TENANT: ${TTN_TENANT:-ttn}
      TTN_REGION: ${TTN_REGION:-eu1}
      TTN_API_KEY: ${TTN_API_KEY:-dummy-api-key}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - trackingmap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trackingmap-frontend
    ports:
      - "8501:8501"
    environment:
      USE_AZURE_SQL: "false"
      USE_POSTGRES: true
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: trackingmap
      POSTGRES_USER: trackingmap
      POSTGRES_PASSWORD: trackingmap123
      BACKEND_URL: "http://backend:8000"
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - trackingmap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:

networks:
  trackingmap-network:
    driver: bridge